<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-labelledby="title description">
  <title id="title">Hi, I'm Rocco.</title>
  <desc id="description">I write fast things fast. A small orbit and accent line animate gently.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e89ff"/>
      <stop offset="1" stop-color="#43d9c4"/>
    </linearGradient>
    <style>
      :root { color-scheme: light dark; }
      .title { fill: #e8edf7; }
      .subtitle { fill: #a4afc3; }
      .ring { stroke: #3b526d; }
      @media (prefers-color-scheme: light) {
        .title { fill: #172238; }
        .subtitle { fill: #52617b; }
        .ring { stroke: #b8c8dc; }
      }
      .copy { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .orbit { transform-origin: 744px 126px; animation: turn 12s linear infinite; }
      .core { animation: breathe 4s ease-in-out infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes breathe { 50% { opacity: .55; } }
      @media (prefers-reduced-motion: reduce) {
        .orbit, .core { animation: none; }
      }
    </style>
  </defs>

  <g class="copy">
    <text class="title" x="48" y="125" font-size="61" font-weight="750" letter-spacing="-2.5">Hi, I'm Rocco.</text>
  </g>
  <g class="copy">
    <text class="subtitle" x="52" y="172" font-size="23" letter-spacing="-.4">I write fast things fast.</text>
  </g>
  <path d="M52 198 H532" fill="none" stroke="#65d6cb" stroke-width="3" stroke-linecap="round" opacity=".8"/>

  <circle class="ring" cx="744" cy="126" r="64" fill="none" stroke-width="1"/>
  <circle class="ring" cx="744" cy="126" r="42" fill="none" stroke-width="1" opacity=".55"/>
  <circle class="core" cx="744" cy="126" r="18" fill="url(#accent)" opacity=".9"/>
  <g class="orbit"><circle cx="744" cy="62" r="6" fill="#65d6cb"/></g>
</svg>
