<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-labelledby="title description">
  <title id="title">Hi, I'm Rocco.</title>
  <desc id="description">I build things that work. A small orbit and accent line animate gently.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e89ff"/>
      <stop offset="1" stop-color="#43d9c4"/>
    </linearGradient>
    <style>
      :root { color-scheme: light dark; }
      .title { fill: #e8edf7; }
      .subtitle { fill: #a4afc3; }
      .eyebrow { fill: #65d6cb; }
      .ring { stroke: #3b526d; }
      @media (prefers-color-scheme: light) {
        .title { fill: #172238; }
        .subtitle { fill: #52617b; }
        .eyebrow { fill: #087d81; }
        .ring { stroke: #b8c8dc; }
      }
      .copy { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .intro { animation: rise 850ms ease-out both; }
      .detail { animation: rise 850ms 180ms ease-out both; }
      .line { stroke-dasharray: 480; animation: draw 1.2s 350ms ease-out both; }
      .orbit { transform-origin: 744px 126px; animation: turn 12s linear infinite; }
      .core { animation: breathe 4s ease-in-out infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes draw { from { stroke-dashoffset: 480; } to { stroke-dashoffset: 0; } }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes breathe { 50% { opacity: .55; } }
      @media (prefers-reduced-motion: reduce) {
        .intro, .detail, .line, .orbit, .core { animation: none; }
      }
    </style>
  </defs>

  <g class="copy intro">
    <text class="eyebrow" x="52" y="76" font-size="13" font-weight="700" letter-spacing="3">HELLO, WORLD</text>
    <text class="title" x="48" y="145" font-size="61" font-weight="750" letter-spacing="-2.5">Hi, I'm Rocco.</text>
  </g>
  <g class="copy detail">
    <text class="subtitle" x="52" y="190" font-size="23" letter-spacing="-.4">I build things that work.</text>
  </g>
  <path class="line" d="M52 214 H532" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

  <circle class="ring" cx="744" cy="126" r="64" fill="none" stroke-width="1"/>
  <circle class="ring" cx="744" cy="126" r="42" fill="none" stroke-width="1" opacity=".55"/>
  <circle class="core" cx="744" cy="126" r="18" fill="url(#accent)" opacity=".9"/>
  <g class="orbit"><circle cx="744" cy="62" r="6" fill="#65d6cb"/></g>
</svg>
