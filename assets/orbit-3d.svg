<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-labelledby="title description">
  <title id="title">Hi, I'm Rocco.</title>
  <desc id="description">I write fast things, fast. A small shaded sphere has a tilted, animated orbit.</desc>
  <defs>
    <radialGradient id="sphere" cx="34%" cy="27%" r="75%">
      <stop offset="0" stop-color="#a5f2e9"/>
      <stop offset=".38" stop-color="#5fbfd0"/>
      <stop offset="1" stop-color="#416db0"/>
    </radialGradient>
    <radialGradient id="satellite" cx="32%" cy="27%" r="75%">
      <stop offset="0" stop-color="#e1fffb"/>
      <stop offset=".45" stop-color="#73e7d8"/>
      <stop offset="1" stop-color="#238eab"/>
    </radialGradient>
    <style>
      :root { color-scheme: light dark; }
      .copy { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #e8edf7; }
      .motto { fill: #75d6d0; }
      .track { stroke: #526581; }
      .near-track { stroke: #7ec8ca; }
      @media (prefers-color-scheme: light) {
        .title { fill: #172238; }
        .motto { fill: #187f88; }
        .track { stroke: #a9bbd0; }
        .near-track { stroke: #288f9b; }
      }
    </style>
  </defs>

  <g class="copy">
    <text class="title" x="48" y="125" font-size="61" font-weight="750" letter-spacing="-2.5">Hi, I'm Rocco.</text>
    <text class="motto" x="52" y="172" font-size="23" font-weight="500" letter-spacing="-.4">I write fast things, fast.</text>
  </g>

  <g transform="rotate(-22 744 126)">
    <ellipse class="track" cx="744" cy="126" rx="83" ry="38" fill="none" stroke-width="1.5" opacity=".72"/>
    <circle cx="744" cy="126" r="27" fill="url(#sphere)"/>
    <circle cx="736" cy="117" r="7" fill="#e3fffb" opacity=".16"/>
    <path class="near-track" d="M827 126 A83 38 0 0 1 661 126" fill="none" stroke-width="1.8" stroke-linecap="round" opacity=".85"/>
    <circle r="6" fill="url(#satellite)">
      <animateMotion dur="7s" repeatCount="indefinite" path="M827 126 A83 38 0 0 1 661 126 A83 38 0 0 1 827 126"/>
      <animate attributeName="r" values="6;8;6;4;6" keyTimes="0;.25;.5;.75;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;1;.8;.45;.8" keyTimes="0;.25;.5;.75;1" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
